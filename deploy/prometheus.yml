global:
  scrape_interval: 5s

# Services run on the host during dev (go run), so Prometheus reaches them via host.docker.internal.
scrape_configs:
  - job_name: vault
    static_configs:
      - targets:
          - host.docker.internal:8080 # gateway
          - host.docker.internal:8081 # order
          - host.docker.internal:8082 # payment
          - host.docker.internal:8083 # user
          - host.docker.internal:8084 # pipeline
