global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Services run on the host during dev (make run), so Prometheus reaches them via host.docker.internal.
# Each target gets a `service` label so runtime metrics (goroutines, heap) can be told apart.
# honor_labels keeps the service label that RPC metrics already carry.
scrape_configs:
  - job_name: vault
    honor_labels: true
    static_configs:
      - targets: [host.docker.internal:8090]
        labels: {service: gateway}
      - targets: [host.docker.internal:8081]
        labels: {service: order}
      - targets: [host.docker.internal:8082]
        labels: {service: payment}
      - targets: [host.docker.internal:8083]
        labels: {service: user}
      - targets: [host.docker.internal:8084]
        labels: {service: pipeline}
